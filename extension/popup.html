<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 280px;
      background: #1a1a1a;
      color: #f0f0f0;
      padding: 16px;
    }

    h3 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
    }

    #url-preview {
      font-size: 11px;
      color: #666;
      margin-bottom: 10px;
      word-break: break-all;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #f0f0f0;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #4caf50;
    }

    #status {
      font-size: 12px;
      color: #aaa;
      min-height: 16px;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    #status.success { color: #4caf50; }
    #status.error   { color: #f44336; }
    #status.warning { color: #ff9800; }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn:last-child { margin-bottom: 0; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .btn-primary { background: #4caf50; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #43a047; }

    .btn-secondary { background: #2a2a2a; color: #aaa; border: 1px solid #444; }
    .btn-secondary:hover:not(:disabled) { background: #333; }

    .btn-danger { background: transparent; color: #f44336; border: 1px solid #f44336; }
    .btn-danger:hover:not(:disabled) { background: #2a1010; }

    .divider {
      border: none;
      border-top: 1px solid #333;
      margin: 10px 0;
    }

    #sheet-link {
      font-size: 11px;
      color: #4caf50;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 6px;
    }

    #sheet-link:hover { text-decoration: underline; }

    /* View states */
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>

  <!-- View: Not signed in -->
  <div id="view-signin" class="view">
    <h3>Track this company</h3>
    <div id="status-signin" class="status">Sign in with Google to get started. Your tracker sheet will be created automatically.</div>
    <br>
    <button class="btn btn-primary" id="signin-btn">Connect to Google</button>
  </div>

  <!-- View: Signed in, ready to track -->
  <div id="view-track" class="view">
    <h3>Track this company</h3>
    <div id="url-preview"></div>
    <input type="text" id="company-name" placeholder="Company name..." />
    <div id="status" class="status">Edit the name if needed, then click Add.</div>
    <button class="btn btn-primary" id="add-btn">Add to Tracker</button>
    <hr class="divider">
    <a href="#" id="sheet-link" target="_blank">Open my tracker ↗</a>
    <button class="btn btn-secondary" id="signout-btn" style="margin-top:8px;font-size:11px;padding:6px;">Sign out</button>
  </div>

  <!-- View: Loading -->
  <div id="view-loading" class="view">
    <h3>Track this company</h3>
    <div class="status">Loading...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
